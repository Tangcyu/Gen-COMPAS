# Gen-COMPAS workflow configuration for RBP binding-upon-change.
# Run from this directory:
#   gen-compas --config rbp.workflow.yaml --iteration 0 1 2 3 --stepwise
#
# The initial RBP DCD is large and is not bundled in the public example.
# Provide it and the matching topology under ./input before iteration 0.

Workflow:
  root_dir: "./workflow_output"
  initial_data_folders: []
  initial_diffusion_data:
    dcd_path: "./input/Unbias.dcd"
    topology_path: "./input/noh.psf"
  run_initial_unbiased: false
  run_fel: true
  warm_start_diffusion: true
  isolate_steps: true
  # Checked against source infer.yaml files for iterations 0--3.
  iteration_noise_scales: {0: 10.0, 1: 10.0, 2: 1.0, 3: 1.0}
  iteration_diffusion_epochs: {0: 25, 1: 20, 2: 10, 3: 10}

Generative:
  device: "cuda:0"
  random_seed: 42
  model:
    node_feature_dim: 64
    time_embedding_dim: 128
    hidden_dim: 128
    num_schnet_layers: 4
    num_gat_layers: 2
    residue_attn_heads: 4
    k_neighbors: 16
  diffusion:
    timesteps: 200
    beta_schedule: "cosine"
  training:
    epochs: 25
    batch_size: 16
    lr: 1.0e-4
    weight_decay: 1.0e-6
    grad_clip: 1.0
    num_workers: 4
    save_interval: 50
  inference:
    num_samples: 1000
    sample_batch: 100
    noise_scale: 10.0

VCN:
  device: "cuda:0"
  atomselect: "protein and name CA"
  stride: 10
  time_shift: 2
  cvs: ["hinge", "distZ", "distpocket", "RMSD_pocket"]
  cvs_to_plot: ["hinge", "distZ"]
  epochs: 500
  learning_rate: 1.0e-4
  patience: 20
  num_layers: 4
  num_nodes: 128
  k: 1.0
  q_variance: 0.1
  n_targets: 20
  require_n_targets: true

Clustering:
  atom_selection: "protein and name CA"
  n_clusters: 10
  n_per_cluster: 1
  max_k: 20
  select_farthest: true

Occupancy:
  topology_file: "./NAMD_inputs/TOP_files/solvate.psf"
  pdb_file: "./NAMD_inputs/TOP_files/solvate.pdb"
  add_hydrogens: true
  selection: "protein and name CA"

NAMD:
  namd_path: "namd3"
  template_path: "./NAMD_inputs"
  tmd_force_constant: 1000.0
  existing_job_policy: "error"
  protocols:
    - name: "A"
      tmd_template: "TMD.A.conf"
      unbiased_template: "Unbiased.A.conf"
      initial_unbiased_template: "Unbiased.A.conf"
    - name: "B"
      tmd_template: "TMD.B.conf"
      unbiased_template: "Unbiased.B.conf"
      initial_unbiased_template: "Unbiased.B.conf"
  phases:
    tmd: true
    unbiased: true
  execution:
    device: "cpu"
    parallel_jobs: 1
    cpu:
      threads_per_job: 4

RiteWeight:
  dcd_pattern: "*unbias.[AB].dcd"
  colvars_pattern: "*unbias.[AB].colvars.traj"
  tag_regex: "\\.([AB])(?:\\.|$)"
  io:
    topology: "./input/noh.psf"
    stride: 1
  pairing:
    allow_skip_first_colvars: true
    strict: true
  features:
    mode: "internal_zmat"
    internal_zmat:
      atomselect: "protein and name CA"
      atom_order: null
      max_atoms: null
      order: "index"
  riteweight:
    n_clusters: 100
    n_iter: 50
    tol: 1.0e-6
    tol_window: 5
    avg_last: 30
    seed: 2026
    lag: 50
  colvars:
    cv: ["hinge", "distZ", "distpocket", "RMSD_pocket"]
    save_cols: "all"
    periodic_cols: []
    bins: [180, 180, 180, 180]
    temperature_K: 300.0
  committor_labels:
    enabled: true
    cvs_to_label: ["hinge", "distZ"]
    basin_A: [111.0, 10.0]
    basin_B: [127.0, 30.0]
    basin_size: 2.0
    k_prefactor: 1.0
    angle_unit: "degree"

FEL_estimate:
  temperature_K: 300.0
  landscape_F_max: 10.0
  projections:
    - name: "hinge_distZ"
      cvs: ["hinge", "distZ"]
      bins: [180, 180]
      ranges: [[0.0, 180.0], [0.0, 60.0]]
      periodicities: [false, false]
      sigma_bins: [1.0, 1.0]
      F_max: 10.0
