[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Gen-COMPAS"
version = "0.1.0"
description = "Diffusion model training and sampling for protein structures"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "Gen-COMPAS contributors" }
]
dependencies = [
  "mdtraj",
  "numpy",
  "PyYAML",
  "torch>=2.0",
  "tqdm",
]

[project.urls]
Homepage = "https://github.com/Tangcyu/Gen-COMPAS"

[project.scripts]
gen-compas = "run:main"

[tool.setuptools]
include-package-data = true
py-modules = ["run"]

[tool.setuptools.packages.find]
where = ["."]
include = ["common", "common.*", "utils", "utils.*"]

[tool.setuptools.package-data]
"*" = ["*.yaml"]
