# YAML configuration for Gen-COMPAS: Diffusion Model and VCN Committor Model
# Adjust paths and parameters as needed for your system and data

############ Iterative workflow configuration ############
Workflow:
  root_dir: "./Iterations"                  # Creates 0th.Iteration, 1st.Iteration, ...
  initial_data_folders: []                  # Optional initial folders included in cumulative RiteWeight
  initial_diffusion_data:
    dcd_path: "/PATH/TO/INITIAL/UNBIASED.dcd"
    topology_path: "/PATH/TO/INITIAL/TOPOLOGY.psf"
  run_initial_unbiased: false               # Initial DCD above already exists
  run_fel: true
  warm_start_diffusion: true                # Initialize iteration N from iteration N-1 best_model.pt
  iteration_noise_scales: {}                # Optional, e.g. {0: 10.0, 1: 5.0, 2: 1.5}
  iteration_diffusion_epochs: {}            # Optional, e.g. {0: 50, 1: 10, 2: 10}
  isolate_steps: true                       # Separate runtimes also release GPU memory

############ Generative model configuration ############
Generative:
  # General settings
  save_dir: 'PATH/TO/YOUR/MODEL/SAVING'    # Directory to save model checkpoints and logs
  device: 'cuda:0'                         # CUDA device to use (e.g., 'cuda:0' or 'cpu')
  random_seed: 42                          # Random seed for reproducibility
  data:
    dcd_path: "./output_riteweight/diffusion_training.dcd"
    topology_path: "./output_riteweight/diffusion_training.pdb"
    alignment_atomselect: "all"            # RMSD fit selection; transform is applied to every atom

  model:
    node_feature_dim: 64                   # Dimension for node embeddings (residue, atom type, coords)
    time_embedding_dim: 128                # Dimension for time embeddings
    hidden_dim: 128                        # Hidden dimension for MLPs, SchNet filters, Attention
    num_schnet_layers: 4                   # Number of SchNet-style layers for atom-level processing
    num_gat_layers: 2                      # Number of Attention layers for residue-level processing
    residue_attn_heads: 4                  # Number of attention heads for residue-level attention (MUST MATCH MODEL)
    k_neighbors: 16                        # Number of neighbors for k-NN graph (spatial edges)

  diffusion:
    timesteps: 200                         # Number of diffusion steps
    beta_schedule: 'cosine'                # 'cosine' or 'linear'

  training:
    epochs: 50
    batch_size: 64                         # Adjust based on GPU memory
    lr: 1.0e-4                             # Initial/Max learning rate
    weight_decay: 1.0e-6
    grad_clip: 1.0                         # Gradient clipping max norm (0.0 to disable)
    num_workers: 16                        # Number of workers for DataLoader (adjust based on CPU/memory)
    save_interval: 50                      # Save model checkpoint every N epochs

  inference:
    checkpoint: "PATH/TO/YOUR/checkpoint"  # Path to trained model checkpoint
    output:     "PATH/TO/OUTPUT/candidates.dcd" # Generated trajectory
    num_samples: 1000                      # Number of samples to generate
    sample_batch: 100                      # Batch size for sampling (adjust based on GPU memory)
    noise_scale: 1.5                       # Scale of initial noise

############ VCN Committor model configuration ############
VCN:
  # General settings
  device         : 'cuda:0'                # CUDA device to use (e.g., 'cuda:0' or 'cpu')
  label          : "test"

  sampling_path  : "."
  z_matrix       : True
  use_all        : False
  pair_distance  : False
  dcdfile        : ["./output_riteweight/diffusion_training.dcd"]
  traj_fns       : ["./output_riteweight/vcn_training.pt"]
  topfile        : "./output_riteweight/diffusion_training.pdb"
  atomindex      : []
  atomselect     : "protein and name CA"
  stride         : 1
  time_shift     : 1                        # Lag in saved trajectory frames
  trajectory_column: "trajectory_id"       # Prevent lag pairs crossing NAMD jobs
  random_seed    : 42

  cvs            : ["CV1", "CV2"]          # Used only if z_matrix is false
  periodic       :  False                   # Periodicity of the CVs, only if z_matrix is False

  # Training parameters
  epochs         :  5000                    # Number of training epochs
  learning_rate  :  0.0001                  # Learning rate
  patience       :  200                     # Early stopping patience
  batch_size_factor :  0.6                  # Batch size as a factor of total frames
  num_layers     :  4                       # Number of hidden layers
  num_nodes      :  64                      # Number of nodes in each hidden layer
  k              :  1                       #  Value of the force constant of the restraints at the basins

  out_dir        : "PATH/TO/OUTPUT/"        # Output folder for model and results
  cvs_to_plot    : ["CV1", "CV2"]          # CVs to plot in the analysis step, only 2D or 3D supported
  plot_committor_projections: false         # Set true to write committor maps during committor_slice

  # Settings for slicing intermediate frames based on committor values
  gendcdfile     : "PATH/TO/GENERATED.dcd"  # DCD file to slice frames from (generated from generative model)
  model_fn       : "PATH/TO/CHECKPOINT"     # Path to trained model file
  slice_dir      : "PATH/TO/Slicing/OUTPUT" # Directory with slicing outputs
  q_variance     :  0.1                     # Half-width around q=0.5; 0.1 selects 0.4 <= q <= 0.6
  n_targets      :  20                      # First N frames from the configured q slice (no clustering)
  require_n_targets: true                   # Fail rather than emit fewer targets

Clustering:
  topology       : "PATH/TO/PSF.psf"
  trajectory     : "PATH/TO/DCD.dcd"
  atom_selection : "protein and name CA"    # Atom selection for clustering (mdtraj format)
  output_dir     : "./output_clusters"      # Directory to save clustering results
  n_clusters     : null                     # auto-determined if null
  n_per_cluster  : 2                        # number of frames to save per cluster
  max_k          : 8                        # used only if n_clusters is null
  select_farthest: true                     # also include farthest frames along with cluster centers

Occupancy:
  pdb_dir        : "./input_pdbs"           # Generated target PDBs without hydrogen atoms
  topology_file  : "system_withH.psf"       # Reference topology WITH hydrogen atoms
  pdb_file       : "reference_withH.pdb"    # Matching reference coordinates WITH hydrogen atoms
  output_dir     : "./output_pdbs"          # Directory to save processed PDB files
  add_hydrogens  : true                     # if false, only occupancy is set
  selection      : "protein and name CA"    # MDTraj/MDAnalysis-style selection for setting occupancy=1, else 0 (for targeted MD)

############ Parallel TMD and unbiased NAMD simulations ############
NAMD:
  namd_path         : "/PATH/TO/namd3"      # NAMD executable or command available on PATH
  template_path     : "/PATH/TO/NAMD_inputs" # Directory copied into every isolated job
  output_dir        : "./output_namd"
  tmd_force_constant: 10000.0               # Replaces TMDk in every TMD template (full system force constant, kcal/mol/Å²)
  existing_job_policy: "error"              # error or skip; existing jobs are never overwritten

  targets:
    path           : "./output_pdbs"        # Generated target structures
    pattern        : "*.pdb"
    recursive      : false
    target_filename: "output.pdb"           # Filename used by TMDFile inside each job

  # Each target/protocol pair is one job. Its TMD phase must finish before
  # the corresponding unbiased phase starts.
  protocols:
    - name: "A"
      tmd_template: "TMD.A.conf"
      unbiased_template: "Unbiased.A.conf"
      initial_unbiased_template: "Initial.A.conf" # Starts directly from state A
    - name: "B"
      tmd_template: "TMD.B.conf"
      unbiased_template: "Unbiased.B.conf"
      initial_unbiased_template: "Initial.B.conf" # Starts directly from state B

  phases:
    tmd     : true
    unbiased: true

  execution:
    device      : "gpu"                    # cpu or gpu
    parallel_jobs: 2                        # Maximum simultaneous NAMD processes
    dry_run     : false                     # If true, prepare jobs and commands without NAMD execution
    cpu:
      threads_per_job: 8
      command: ["{namd}", "+p{threads}", "{config}"]
    gpu:
      devices: ["0", "1"]                 # One device slot per parallel GPU job
      threads_per_job: 1
      command: ["{namd}", "+p{threads}", "+devices", "{device}", "{config}"]

############ RiteWeight configuration ############
RiteWeight:
  folders:
    - "PATH/TO/TRAJECTORY/FOLDER"
  dcd_pattern: "*Unbiased.[AB].dcd"         # Exact recursive filename pattern
  colvars_pattern: "*Unbiased.[AB].colvars.traj"
  tag_regex: "\\.([AB])(?:\\.|$)"           # A/B protocol tag used for pairing

  io:
    topology: "PATH/TO/TOPOLOGY.psf"
    out: "./output_riteweight"
    stride: 1

  pairing:
    allow_skip_first_colvars: true
    strict: true

  features:
    mode: "internal_zmat"                   # internal_zmat, internal_zmat_cached, or distances
    internal_zmat:
      atomselect: "protein and name CA"     # MDTraj selection used to construct 3N-6 features
      atom_order: null                       # Optional explicit zero-based atom index order
      max_atoms: null
      order: "index"
    distances:
      atom_pairs: []                         # Used only when mode is distances
    cache:
      enabled: true
      format: "npz"
      path: "./output_riteweight/features_internal_zmat.npz"
      policy: "write_if_missing"            # write_if_missing or force_recompute

  riteweight:
    n_clusters: 100
    n_iter: 200
    tol: 1.0e-6
    tol_window: 5
    avg_last: 20
    seed: 2026
    lag: 50

  colvars:
    cv: ["CV1", "CV2"]                     # CVs retained for downstream FEL projections
    save_cols: "all"
    periodic_cols: []                       # Columns receiving sin/cos encodings for VCN

  committor_labels:
    enabled: true
    cvs_to_label: ["CV1", "CV2"]
    basin_A: [0.0, 10.0]
    basin_B: [10.0, 0.0]
    basin_size: [5.0, 5.0]
    k_prefactor: 1.0
    angle_unit: "degree"

  outputs:
    frame_csv: "frame_weights.csv"
    segment_csv: "segment_weights.csv"
    convergence_plot: "convergence_delta.png"
    vcn:
      enabled: true
      filename: "vcn_training.pt"           # Tensor table loadable with torch.load
    diffusion:
      enabled: true
      trajectory: "diffusion_training.dcd"
      topology: "diffusion_training.pdb"    # Matching selected topology for the DCD
      atomselect: "protein and not element H"
      alignment_atomselect: null             # null uses the RiteWeight structural feature selection
      chunk_size: 1000

############ Weighted FEL projections from RiteWeight ############
FEL_estimate:
  input: "./output_riteweight/vcn_training.pt"  # RiteWeight .pt or frame_weights.csv
  output_dir: "./output_riteweight/fel"
  weight_column: "fel_weight"                  # Symmetric start/end RiteWeight marginal
  temperature_K: 300.0
  probability_floor: 1.0e-300
  landscape_F_max: 10.0                       # Calculation/fill cap; saved in .dat/.npz
  projections:
    - name: "CV1_CV2"
      cvs: ["CV1", "CV2"]
      bins: [200, 200]
      ranges: [[0.0, 180.0], [0.0, 180.0]]
      periodicities: [true, true]
      sigma_bins: [1.0, 1.0]
      F_max: 10.0                              # PNG display maximum only
