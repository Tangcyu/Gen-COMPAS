[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Gen-COMPAS"
version = "0.2.0"
description = "Generative committor-guided path sampling for rare events"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "Gen-COMPAS contributors" }
]
dependencies = [
  "matplotlib",
  "MDAnalysis",
  "mdtraj",
  "numpy",
  "pandas",
  "Pillow",
  "PyYAML",
  "scikit-learn",
  "scipy",
  "torch>=2.0",
  "tensorboard",
  "tqdm",
]

[project.optional-dependencies]
gui-build = ["pyinstaller>=6"]

[project.urls]
Homepage = "https://github.com/Tangcyu/Gen-COMPAS"

[project.scripts]
gen-compas = "workflow:main"
gen-compas-workflow = "workflow:main"
gen-compas-config = "helper.config_helper:main"

[tool.setuptools]
include-package-data = true
py-modules = ["workflow"]

[tool.setuptools.packages.find]
where = ["."]
include = ["common", "common.*", "figures", "helper", "tools", "tools.*", "utils", "utils.*", "vcn", "vcn.*"]

[tool.setuptools.package-data]
"*" = ["*.yaml"]
"figures" = ["scheme.png"]
