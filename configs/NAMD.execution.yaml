# Defaults for NAMD.execution; override under NAMD.execution in your run YAML.
device: cpu
parallel_jobs: 1
dry_run: false
cpu:
  threads_per_job: 1
  command:
  - '{namd}'
  - +p{threads}
  - '{config}'
gpu:
  devices:
  - '0'
  threads_per_job: 1
  command:
  - '{namd}'
  - +p{threads}
  - +devices
  - '{device}'
  - '{config}'
